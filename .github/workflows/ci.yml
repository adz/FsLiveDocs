name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch native Pagefind
        run: bash scripts/fetch-pagefind.sh current

      - name: Check release notes
        run: bash scripts/check-release-notes.sh

      - name: Restore
        run: dotnet restore FsLiveDocs.slnx

      - name: Build documentation generator
        run: dotnet build src/FsLiveDocs.Cli/FsLiveDocs.Cli.fsproj --configuration Release --no-restore

      - name: Build documentation sample
        run: dotnet build samples/DeepReference/Acme.Docs/Acme.Docs.fsproj --configuration Release

      - name: Regenerate documentation tests
        run: dotnet artifacts/bin/FsLiveDocs.Cli/release/livedocs.dll generate-tests --interactive false --banner false

      - name: Build
        run: dotnet build FsLiveDocs.slnx --configuration Release --no-restore

      - name: Test
        # A test host that makes no progress for 10 minutes is killed and the hanging test is named.
        run: dotnet test FsLiveDocs.slnx --configuration Release --no-build --blame-hang-timeout 10m --blame-hang-dump-type none

      - name: Verify documentation
        run: dotnet artifacts/bin/FsLiveDocs.Cli/release/livedocs.dll test --interactive false --banner false

      - name: Build documentation site
        run: dotnet artifacts/bin/FsLiveDocs.Cli/release/livedocs.dll build --interactive false --banner false
