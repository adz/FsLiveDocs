name: Pages

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/pages.yml
      - .livedocs/history.json
      - docs/**
      - src/**
      - Directory.Build.props
      - FsLiveDocs.slnx
  workflow_dispatch:
    inputs:
      version:
        description: Released semantic version to add to the history build
        required: false
        type: string
      capsule_url:
        description: HTTPS URL of the released documentation capsule
        required: false
        type: string
      capsule_sha256:
        description: SHA-256 of the released documentation capsule
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore
        run: dotnet restore src/FsLiveDocs.Cli/FsLiveDocs.Cli.fsproj

      - name: Build FsLiveDocs
        run: dotnet build src/FsLiveDocs.Cli/FsLiveDocs.Cli.fsproj --configuration Release --no-restore

      - name: Add the newly released capsule to this history build
        if: inputs.version != ''
        run: |
          dotnet artifacts/bin/FsLiveDocs.Cli/release/livedocs.dll history-add "${{ inputs.version }}" \
            --url "${{ inputs.capsule_url }}" \
            --sha256 "${{ inputs.capsule_sha256 }}" \
            --interactive false \
            --banner false

      - name: Render release history
        run: dotnet artifacts/bin/FsLiveDocs.Cli/release/livedocs.dll build-history .livedocs/history.json --interactive false --banner false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
