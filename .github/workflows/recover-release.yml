name: Recover release publication

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version whose GitHub Release already exists
        required: true
        type: string

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: recover-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - name: Validate version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must have the form MAJOR.MINOR.PATCH; got $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Deploy the recorded release history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="${{ github.event.repository.default_branch }}"
          sha="${{ github.sha }}"
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --branch "$branch" \
              --json databaseId,event,headSha \
              --jq '[.[] | select(.event == "workflow_dispatch" and .headSha == "'"$sha"'")][0].databaseId // 0')"
            [ "$run_id" != "0" ] && break
            sleep 2
          done
          [ "$run_id" != "0" ] || { echo "Pages run for $sha was not observed." >&2; exit 1; }
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Download packages from the immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/packages
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir artifacts/packages \
            --pattern '*.nupkg' --pattern '*.snupkg'
          test -f "artifacts/packages/FsLiveDocs.$VERSION.nupkg"
          test -f "artifacts/packages/FsLiveDocs.Annotations.$VERSION.nupkg"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/packages/*.nupkg artifacts/packages/*.snupkg; do
            [ -e "$package" ] || continue
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
