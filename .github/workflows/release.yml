name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must have the form vMAJOR.MINOR.PATCH; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check release notes
        run: bash scripts/check-release-notes.sh "$VERSION"

      - name: Restore
        run: dotnet restore FsLiveDocs.slnx

      - name: Build the generator
        run: dotnet build src/FsLiveDocs.Cli/FsLiveDocs.Cli.fsproj --configuration Release --no-restore -p:Version="$VERSION"

      - name: Build documentation sample
        run: dotnet build samples/DeepReference/Acme.Docs/Acme.Docs.fsproj --configuration Release -p:Version="$VERSION"

      - name: Regenerate snapshot tests for this checkout
        run: dotnet artifacts/bin/FsLiveDocs.Cli/release/livedocs.dll generate-tests --interactive false --banner false

      - name: Build
        run: dotnet build FsLiveDocs.slnx --configuration Release --no-restore -p:Version="$VERSION"

      - name: Test
        run: dotnet test FsLiveDocs.slnx --configuration Release --no-build -p:Version="$VERSION"

      - name: Pack
        run: dotnet pack FsLiveDocs.slnx --configuration Release --no-build -p:Version="$VERSION" --output artifacts/packages

      - name: Verify package set
        shell: bash
        run: |
          expected=(
            FsLiveDocs
            FsLiveDocs.Annotations
          )
          for package in "${expected[@]}"; do
            test -f "artifacts/packages/$package.$VERSION.nupkg" || {
              echo "Missing package: $package.$VERSION.nupkg" >&2
              exit 1
            }
          done
          test "$(find artifacts/packages -maxdepth 1 -name '*.nupkg' | wc -l)" -eq "${#expected[@]}"

      - name: Install the packed tool
        run: dotnet tool install FsLiveDocs --tool-path .tools --version "$VERSION" --add-source artifacts/packages

      - name: Verify and build documentation
        run: |
          .tools/livedocs test
          .tools/livedocs build

      - name: Capture release documentation
        run: .tools/livedocs capture --version "$VERSION" --output "artifacts/FsLiveDocs-$VERSION-livedocs.zip"

      - name: Verify candidate in the complete release history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest="$RUNNER_TEMP/candidate-history.json"
          cp .livedocs/history.json "$manifest"
          .tools/livedocs history-sync "$GITHUB_REPOSITORY" --output "$manifest" --interactive false --banner false
          .tools/livedocs history-add "$VERSION" --capsule "$PWD/artifacts/FsLiveDocs-$VERSION-livedocs.zip" --output "$manifest" --interactive false --banner false
          .tools/livedocs build-history "$manifest" --retry 3 --interactive false --banner false
          .tools/livedocs verify-output "$manifest" --output output --interactive false --banner false

      - name: Preserve tested packages for publication
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ github.run_id }}
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/packages/*.nupkg \
            artifacts/packages/*.snupkg \
            "artifacts/FsLiveDocs-$VERSION-livedocs.zip" \
            "artifacts/FsLiveDocs-$VERSION-livedocs.zip.report.json" \
            --verify-tag \
            --notes-file "dev-docs/releases/$VERSION.md"

      - name: Publish and await release documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          capsule="artifacts/FsLiveDocs-$VERSION-livedocs.zip"
          capsule_url="https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/FsLiveDocs-$VERSION-livedocs.zip"
          capsule_sha256="$(sha256sum "$capsule" | cut -d ' ' -f 1)"
          before="$(gh run list --workflow pages.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run pages.yml \
            --ref "${{ github.event.repository.default_branch }}" \
            -f version="$VERSION" \
            -f capsule_url="$capsule_url" \
            -f capsule_sha256="$capsule_sha256"
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --workflow pages.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            [[ "$run_id" != "$before" ]] && break
            sleep 2
          done
          [[ "$run_id" != "$before" ]] || { echo "Pages dispatch was not observed." >&2; exit 1; }
          gh run watch "$run_id" --exit-status

  publish-nuget:
    runs-on: ubuntu-latest
    needs: release
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ github.run_id }}
          path: artifacts/packages
      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/packages/*.nupkg artifacts/packages/*.snupkg; do
            [ -e "$package" ] || continue
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
