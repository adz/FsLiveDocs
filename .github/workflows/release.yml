name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must have the form vMAJOR.MINOR.PATCH; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check release notes
        run: bash scripts/check-release-notes.sh "$VERSION"

      - name: Restore
        run: dotnet restore FsLiveDocs.slnx

      - name: Build the generator
        run: dotnet build src/FsLiveDocs.Cli/FsLiveDocs.Cli.fsproj --configuration Release --no-restore -p:Version="$VERSION"

      - name: Build documentation sample
        run: dotnet build samples/DeepReference/Acme.Docs/Acme.Docs.fsproj --configuration Release -p:Version="$VERSION"

      - name: Regenerate snapshot tests for this checkout
        run: dotnet artifacts/bin/FsLiveDocs.Cli/release/livedocs.dll generate-tests --interactive false --banner false

      - name: Build
        run: dotnet build FsLiveDocs.slnx --configuration Release --no-restore -p:Version="$VERSION"

      - name: Test
        run: dotnet test FsLiveDocs.slnx --configuration Release --no-build -p:Version="$VERSION"

      - name: Pack
        run: dotnet pack FsLiveDocs.slnx --configuration Release --no-build -p:Version="$VERSION" --output artifacts/packages

      - name: Verify package set
        shell: bash
        run: |
          expected=(
            FsLiveDocs
            FsLiveDocs.Annotations
          )
          for package in "${expected[@]}"; do
            test -f "artifacts/packages/$package.$VERSION.nupkg" || {
              echo "Missing package: $package.$VERSION.nupkg" >&2
              exit 1
            }
          done
          test "$(find artifacts/packages -maxdepth 1 -name '*.nupkg' | wc -l)" -eq "${#expected[@]}"

      - name: Install the packed tool
        run: dotnet tool install FsLiveDocs --tool-path .tools --version "$VERSION" --add-source artifacts/packages

      - name: Verify and build documentation
        run: |
          .tools/livedocs test
          .tools/livedocs build

      - name: Capture release documentation
        run: .tools/livedocs capture --version "$VERSION" --output "artifacts/FsLiveDocs-$VERSION-livedocs.zip"

      - name: Verify the candidate renders in the release history
        run: |
          .tools/livedocs history-check \
            --capsule "$PWD/artifacts/FsLiveDocs-$VERSION-livedocs.zip" --version "$VERSION" \
            --interactive false --banner false

      - name: Preserve tested packages for publication
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ github.run_id }}
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/packages/*.nupkg \
            artifacts/packages/*.snupkg \
            "artifacts/FsLiveDocs-$VERSION-livedocs.zip" \
            "artifacts/FsLiveDocs-$VERSION-livedocs.zip.report.json" \
            --verify-tag \
            --notes-file "dev-docs/releases/$VERSION.md"

      - name: Record the release in history and await deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${{ github.event.repository.default_branch }}"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/FsLiveDocs-$VERSION-livedocs.zip"
          git fetch origin "$branch"
          git switch "$branch"
          # Sync backfills any prior published capsule and validates the new one is discoverable.
          .tools/livedocs history-sync "$GITHUB_REPOSITORY" \
            --version "$VERSION" --url "$url" \
            --sha256 "$(cat "artifacts/FsLiveDocs-$VERSION-livedocs.zip.sha256")" \
            --output .livedocs/history.json --interactive false --banner false
          .tools/livedocs history-check --version "$VERSION" --interactive false --banner false
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .livedocs/history.json
          git commit -m "Record $VERSION in the release history"
          git push origin "$branch"
          # The push triggers pages.yml; wait for that run to deploy before NuGet publication.
          sha="$(git rev-parse HEAD)"
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --workflow pages.yml --branch "$branch" --json databaseId,headSha \
              --jq '[.[] | select(.headSha == "'"$sha"'")][0].databaseId // 0')"
            [ "$run_id" != "0" ] && break
            sleep 2
          done
          [ "$run_id" != "0" ] || { echo "Pages run for $sha was not observed." >&2; exit 1; }
          gh run watch "$run_id" --exit-status

  publish-nuget:
    runs-on: ubuntu-latest
    needs: release
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ github.run_id }}
          path: artifacts/packages
      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/packages/*.nupkg artifacts/packages/*.snupkg; do
            [ -e "$package" ] || continue
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
